[account]
# Токен авторизации FunPay (cookie golden_key).
# Взять тут: DevTools (F12) -> Application -> Cookies -> https://funpay.com -> значение golden_key.
# Можно не хранить здесь, а задать переменную окружения FUNPAY_GOLDEN_KEY.
golden_key =

# User-Agent браузера, из которого взят golden_key.
user_agent = Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36

# Таймаут запросов к FunPay, секунды.
request_timeout = 15

# Прокси вида http://user:pass@host:port. Пусто = без прокси.
proxy =

[raise]
# Раз в сколько секунд запускать полный цикл поднятия всех категорий.
interval = 14400

# Кулдаун между поднятиями одной и той же категории, секунды.
category_cooldown = 14400

# Пауза между поднятием разных категорий внутри одного цикла, секунды.
category_delay = 3

# Пауза между повторными попытками при ошибке, секунды.
retry_delay = 30

# Сколько раз повторять поднятие категории при ошибке. 0 = бесконечно.
max_retries = 0

# true = при ответе FunPay "Подождите ..." продолжать долбить категорию;
# false = считать это кулдауном и идти к следующей категории.
ignore_cooldown = false

# Список ID игр (game_id) через запятую. Пусто = все активные категории.
# Пример: games = 41, 1234, 5678
games =

[logging]
# Уровень вывода в консоль: DEBUG, INFO, WARNING, ERROR.
level = INFO

# Файл лога, ротация 5 МБ до 5 файлов.
file = logs/funpay_autoup.log
